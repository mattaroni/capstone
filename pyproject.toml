[project]
name = "capstone"
version = "0.1.0"
description = ""
authors = [
    {name = "Matthew Marshall",email = "matthewmarshall5@my.unt.edu"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asent (>=0.8.3,<0.9.0)",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz",
    "spacy (>=3.8.11,<3.8.14)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "click (>=8.2.1,<9.0.0)",
]

[tool.poetry]
packages = [{include = "capstone", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.2,<10.0.0)"
]
