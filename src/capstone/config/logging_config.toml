version = 1
disable_existing_loggers = false

[formatters.pretty]
'()' = "log_settings.PrettyFormatter"

[formatters.detailed]
'()' = "log_settings.DetailedFormatter"
fmt = "{asctime} {filename} {levelname}: {message}"

[handlers.stdout]
class = "logging.StreamHandler"
level = "INFO"
formatter = "pretty"
stream = "ext://sys.stdout"

[handlers.file]
class = "logging.handlers.RotatingFileHandler"
level = "DEBUG"
formatter = "detailed"
filename = "logs/capstone.log"
maxBytes = 10_000_000
backupCount = 3

[handlers.queue_handler]
class = "logging.handlers.QueueHandler"
handlers = ["stdout", "file"]
respect_handler_level = true

[loggers.root]
level = "DEBUG"
handlers = ["queue_handler"]
